# Local development stack.
#   Infra only (run API/web from your IDE):   docker compose up -d postgres
#   Everything in containers:                 docker compose --profile app up --build
# Values come from .env (copy .env.example). Never use these defaults outside your machine.
name: event-content

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-event_content}
      POSTGRES_USER: ${POSTGRES_USER:-event_content}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432" # bound to localhost only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrator:
    profiles: ["app", "migrate"]
    build:
      context: .
      dockerfile: src/EventContent.Migrator/Dockerfile
    environment:
      ConnectionStrings__Database: Host=postgres;Database=${POSTGRES_DB:-event_content};Username=${POSTGRES_USER:-event_content};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/EventContent.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Database: Host=postgres;Database=${POSTGRES_DB:-event_content};Username=${POSTGRES_USER:-event_content};Password=${POSTGRES_PASSWORD}
      Auth__Mode: Development
      Auth__Development__DefaultUserEmail: ${DEV_USER_EMAIL:-owner@example.com}
    ports:
      - "127.0.0.1:5080:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully

  web:
    profiles: ["app"]
    build:
      context: ./web
    environment:
      API_BASE_URL: http://api:8080
      DEV_AUTH_ENABLED: "true"
      DEV_USER_EMAIL: ${DEV_USER_EMAIL:-owner@example.com}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
